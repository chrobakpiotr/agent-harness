name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline package checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ '3.13' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Remove group and world write from the interpreter and system executable paths
        # The runner ships /usr/local/bin, /opt and the setup-python tree as mode 777; the executable resolver
        # (agent_harness.executables) correctly refuses binaries under writable directories.
        run: |
          sudo chmod go-w /usr/local/bin /opt /opt/hostedtoolcache /opt/hostedtoolcache/Python
          sudo chmod -R go-w "$(dirname "$pythonLocation")"

      - name: Whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD

      - name: Lint
        run: pipx run ruff==0.16.10 check .

      - name: Build wheel, install outside checkout, test installed package
        env:
          AGENT_HARNESS_BENCHMARK: '1'  # planning benchmark limits are calibrated for CI runners
        run: scripts/check-wheel.sh
