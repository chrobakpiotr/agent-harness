[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
dynamic = ["version"]
description = "Agent execution/lifecycle/evidence library extracted from the Showcase harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Showcase target; the moved modules use 3.10+ syntax and APIs verbatim.
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Ed25519 grant signatures (verification.human_grants); same pin as Showcase.
grants = ["cryptography==49.0.0"]

[project.urls]
Repository = "https://github.com/chrobakpiotr/agent-harness"

[project.scripts]
agent-harness = "agent_harness.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "agent_harness.__version__"}

[tool.setuptools.package-data]
agent_harness = ["contract_fixtures/*.json", "schemas/*.json", "constitution.md",
                 "qualification/reviewed/*/report.json", "qualification/reviewed/*/evidence/*",
                 "qualification/reviewed/*/evidence/*/*"]

[tool.ruff.lint.per-file-ignores]
# Verbatim extraction from Showcase (docs/migration/provenance.md); restyle only in a separate change.
"src/agent_harness/verification/*.py" = ["BLE001", "C408", "F401", "F841", "I001", "PIE810", "PLW0127", "RUF007", "SIM102",
                                         "SIM103", "SIM114", "TRY004", "RUF059", "RUF023"]
"src/agent_harness/telemetry.py" = ["UP017"]
"src/agent_harness/eval_runner.py" = ["F841", "UP017"]
"src/agent_harness/task_runner.py" = ["C401", "TRY004"]
"src/agent_harness/state_snapshots.py" = ["SIM102", "TRY203", "UP017", "UP022"]
# Verbatim from harness.py (AH5-14a): `validate_loaded_state` keeps the source's unused `expected`.
"src/agent_harness/feature_state.py" = ["F841"]
# Verbatim from harness.py (AH5-14b-1): `initial_state` keeps the source's `dt.timezone.utc`.
"src/agent_harness/feature_access.py" = ["UP017"]
# Verbatim from harness.py (AH5-14b-2 step 1): `parse_aware_timestamp` as the source writes it.
"src/agent_harness/lifecycle_checks.py" = ["FURB162", "UP017"]
# Verbatim executor: its per-gate callbacks run synchronously inside their own loop iteration.
"src/agent_harness/verification/executor.py" = ["B023"]
"src/agent_harness/sandbox.py" = ["BLE001", "SIM102", "TRY004", "UP037"]
# Verbatim Showcase qualification probes (docs/migration/provenance.md); restyle only in a separate change.
"src/agent_harness/qualification/[bqr]*.py" = ["ALL"]
# Showcase-only part of telemetry, verbatim in the cutover wrapper.
"migration/showcase-wrapper/telemetry.py" = ["BLE001", "F401", "FURB162", "TRY004"]
# Showcase retry-control policy, verbatim from its store and supervisor.
"migration/showcase-wrapper/verification/retry_controls.py" = ["PIE810"]
# Same mode as Showcase's verify.py (100644, with a shebang; it runs as `python3 verify.py`).
"migration/showcase-wrapper/verify.py" = ["EXE001"]
# Showcase's runner.py: verbatim apart from the AH5-12a bindings; its imports serve the launch kept until 12b.
"migration/showcase-wrapper/runner.py" = ["F401", "I001", "RUF100", "UP017"]
# Showcase's verification_contract.py: verbatim apart from the AH5-13 bindings; its imports serve generate.
"migration/showcase-wrapper/verification_contract.py" = ["F401", "RUF100"]
# Showcase's harness.py: verbatim apart from the AH5-14a bindings (7,000 lines of its own code, restyled only by Showcase).
"migration/showcase-wrapper/harness.py" = ["ALL"]
# Ported Showcase tests: only imports and seams changed (provenance.md).
"tests/test_verification_authority.py" = ["C408", "I001", "SIM117"]
"tests/test_executables.py" = ["SIM117"]
"tests/test_backend_qualification.py" = ["SIM117"]
"tests/test_verification_workspace.py" = ["PLW1510", "SIM117"]
"tests/test_verification_supervisor.py" = ["B023", "BLE001", "C408"]
"tests/test_verification_noncacheable.py" = ["C408", "PLC0206"]
"tests/test_state_snapshots.py" = ["B023", "BLE001"]
"tests/test_verify_cli.py" = ["C408", "F841"]
"tests/test_verification_store.py" = ["B023", "F401", "F841", "I001", "RUF059", "SIM117"]
